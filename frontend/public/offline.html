<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0f1117">
<title>Offline | Wazelo CRM</title>
<style>
  :root { color-scheme: dark; }
  * { box-sizing: border-box; }
  html, body { height: 100%; margin: 0; }
  body {
    display: flex; flex-direction: column; align-items: center; justify-content: center;
    gap: 14px; padding: 24px; padding-top: max(24px, env(safe-area-inset-top));
    padding-bottom: max(24px, env(safe-area-inset-bottom));
    background: #0f1117; color: #e8eaed; text-align: center;
    font: 15px/1.45 -apple-system, BlinkMacSystemFont, "SF Pro Text", "Inter", system-ui, sans-serif;
    -webkit-font-smoothing: antialiased;
  }
  img { width: 88px; height: 88px; border-radius: 22px; }
  h1 { margin: 6px 0 0; font-size: 22px; font-weight: 700; letter-spacing: -0.01em; }
  p { margin: 0; max-width: 300px; color: #a3aabb; }
  button {
    margin-top: 8px; height: 46px; min-width: 180px; padding: 0 22px; border: 0; border-radius: 14px;
    background: #d97706; color: #1a1d27; font: inherit; font-weight: 600; cursor: pointer;
    -webkit-tap-highlight-color: transparent;
  }
  button:active { opacity: .8; }
</style>
</head>
<body>
  <img src="/icons/icon-192.png" alt="">
  <h1>You're offline</h1>
  <p>Wazelo needs a connection to load your inbox. It will reopen as soon as you're back online.</p>
  <button type="button" onclick="location.reload()">Try again</button>
  <script>window.addEventListener("online", function () { location.reload(); });</script>
</body>
</html>
